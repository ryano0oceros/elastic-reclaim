name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  proxy:
    name: Proxy (tests + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - name: Tests
        run: pytest -q
      - name: Dependency vulnerability audit
        run: |
          pip install pip-audit
          pip-audit --strict --progress-spinner off

  terraform:
    name: Terraform (fmt + validate + tfsec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - name: Format check
        run: terraform -chdir=terraform fmt -recursive -check -diff
      - name: Validate
        run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate
      - name: Static analysis
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          # The open security group and public-IP tasks are deliberate PoC
          # choices documented in the README; everything else should stay clean.
          severity: HIGH,CRITICAL
          exit-code: "0"

  image:
    name: Container image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t eis-proxy:ci proxy
      - name: Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: eis-proxy:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Run the binary directly rather than gitleaks/gitleaks-action@v2. The
      # action derives a commit range from the push event and scans
      # `<before>^..<after>`, which fails outright when <before> is a root
      # commit - there is no parent to resolve. That is the state this
      # repository is in after publishing from a squashed history.
      #
      # `detect` over the full history is also strictly the stronger check:
      # it re-scans everything on every run instead of only the pushed range,
      # so a secret cannot slip in via a path the incremental scan skipped.
      # The history here is small enough that the cost is negligible.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full history
        run: gitleaks detect --redact --verbose --exit-code 1
      # Belt and braces: `detect` reads git history, so an uncommitted or
      # untracked file in the working tree is invisible to it.
      - name: Scan working tree
        run: gitleaks detect --no-git --redact --verbose --exit-code 1
