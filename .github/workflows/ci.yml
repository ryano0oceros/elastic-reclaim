name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  proxy:
    name: Proxy (tests + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - name: Tests
        run: pytest -q
      - name: Dependency vulnerability audit
        run: |
          pip install pip-audit
          pip-audit --strict --progress-spinner off

  terraform:
    name: Terraform (fmt + validate + tfsec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: Format check
        run: terraform -chdir=terraform fmt -recursive -check -diff
      - name: Validate
        run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate
      - name: Static analysis
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          # The open security group and public-IP tasks are deliberate PoC
          # choices documented in the README; everything else should stay clean.
          severity: HIGH,CRITICAL
          exit-code: "0"

  image:
    name: Container image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t eis-proxy:ci proxy
      - name: Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: eis-proxy:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
