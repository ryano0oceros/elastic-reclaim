name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not report a security vulnerability here.** Use the private
        reporting path in [SECURITY.md](../blob/main/SECURITY.md) instead.

        **Scrub secrets from anything you paste.** Bearer tokens, Elastic API
        keys, ALB hostnames, Elastic endpoint URLs, and AWS account IDs all
        turn up in logs and error output.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what occurred instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The smallest reproduction you can manage.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Proxy (FastAPI translation / auth / streaming)
        - Terraform - AWS module
        - Terraform - Elastic module
        - Analytics or Kibana dashboards
        - Scripts (deploy.sh / dev-setup.sh)
        - Documentation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: >
        Proxy logs, Terraform output, or the client-side error.
        Check once more that no tokens, endpoints, or account IDs remain.
      render: text

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - Client: OpenCode 1.2.3 (terminal / VS Code extension)
        - Deployment: ECS Fargate / local docker / local uvicorn
        - Model alias: claude
        - Terraform version:

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I have removed all secrets from the text above
          required: true
        - label: This is not a security vulnerability report
          required: true
